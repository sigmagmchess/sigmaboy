<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VEGA — Satranç</title>
<style>
/* ============================================================ SigmaBoy UI */
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #262421;
  --bg2: #1c1a18;
  --card: #2e2b28;
  --card2: #383431;
  --text: #e8e6e3;
  --text-dim: #9d9995;
  --accent: #81b64c;
  --accent-hover: #93c85c;
  --danger: #ca3431;
  --warn: #e8a33d;
  --radius: 10px;
  --sq-light: #eaefce;
  --sq-dark: #739552;
  --sq-hl: rgba(255, 235, 59, 0.45);
}
body[data-theme="brown"] { --sq-light: #f0d9b5; --sq-dark: #b58863; }
body[data-theme="blue"]  { --sq-light: #dee3e6; --sq-dark: #6a8fa8; }
body[data-theme="purple"]{ --sq-light: #e6dbef; --sq-dark: #8a6aa8; }

html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 15px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ---------------------------------------------------------- top bar */
#topbar {
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 10px 20px;
  background: var(--bg2);
  border-bottom: 1px solid #000;
  flex-shrink: 0;
}
.logo { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
.logo span { color: var(--accent); }
#tabs { display: flex; gap: 4px; }
.tab {
  background: none; border: none; color: var(--text-dim);
  font-size: 15px; font-weight: 600; padding: 8px 16px;
  border-radius: 8px; cursor: pointer; transition: all .15s;
}
.tab:hover { color: var(--text); background: var(--card); }
.tab.active { color: #fff; background: var(--card2); }
.top-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.icon-btn {
  background: var(--card); border: none; color: var(--text);
  font-size: 16px; width: 36px; height: 36px; border-radius: 8px; cursor: pointer;
}
.icon-btn:hover { background: var(--card2); }

/* ---------------------------------------------------------- layout */
#layout {
  flex: 1;
  display: flex;
  gap: 20px;
  padding: 16px 20px;
  overflow: hidden;
  justify-content: center;
}
#board-zone {
  display: flex;
  gap: 12px;
  align-items: center;
  min-width: 0;
}
#board-stack { display: flex; flex-direction: column; gap: 8px; }

/* ---------------------------------------------------------- eval bar */
#evalbar {
  width: 26px;
  height: min(76vh, 76vw);
  align-self: center;
  background: #403d3a;
  border-radius: 6px;
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column-reverse;
}
#evalbar-white {
  background: #f0eee8;
  width: 100%;
  height: 50%;
  transition: height .5s ease;
}
#evalbar-num {
  position: absolute;
  left: 0; right: 0;
  text-align: center;
  font-size: 10px;
  font-weight: 700;
  bottom: 4px;
  color: #333;
}
#evalbar-num.black-side { bottom: auto; top: 4px; color: #eee; }
#evalbar.hidden { display: none; }

/* ---------------------------------------------------------- board */
#board-wrap {
  position: relative;
  width: min(76vh, 76vw);
  height: min(76vh, 76vw);
  border-radius: 6px;
  overflow: hidden;
  box-shadow: 0 8px 30px rgba(0,0,0,.5);
  user-select: none;
  touch-action: none;
}
#board { position: absolute; inset: 0; }
.sq { position: absolute; width: 12.5%; height: 12.5%; }
.sq.light { background: var(--sq-light); }
.sq.dark { background: var(--sq-dark); }
.sq .coord {
  position: absolute; font-size: 11px; font-weight: 700; opacity: .8;
  pointer-events: none;
}
.sq.light .coord { color: var(--sq-dark); }
.sq.dark .coord { color: var(--sq-light); }
.coord.rank { top: 2px; left: 3px; }
.coord.file { bottom: 1px; right: 4px; }

.sq.lastmove::before {
  content: ''; position: absolute; inset: 0; background: var(--sq-hl);
}
.sq.selected::before {
  content: ''; position: absolute; inset: 0; background: rgba(90, 160, 255, 0.4);
}
.sq.check::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(circle, rgba(255,40,40,.75) 15%, rgba(255,40,40,.25) 55%, transparent 75%);
}
.sq.dest::after {
  content: ''; position: absolute; left: 50%; top: 50%;
  width: 30%; height: 30%; transform: translate(-50%, -50%);
  background: rgba(0,0,0,.22); border-radius: 50%;
}
.sq.capture-dest::after {
  content: ''; position: absolute; inset: 3%;
  border: 5px solid rgba(0,0,0,.22); border-radius: 50%;
}

.piece {
  position: absolute;
  width: 12.5%; height: 12.5%;
  z-index: 2;
  cursor: grab;
}
.piece svg { width: 100%; height: 100%; filter: drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
.piece.dragging { z-index: 10; cursor: grabbing; pointer-events: none; transform: scale(1.1); }

#overlay {
  position: absolute; inset: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 5;
}

#class-badge {
  position: absolute; z-index: 6;
  width: 26px; height: 26px; border-radius: 50%;
  color: #fff; font-size: 13px; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 6px rgba(0,0,0,.5);
  pointer-events: none;
}

#promo-picker {
  position: absolute; z-index: 20;
  left: 50%; top: 50%; transform: translate(-50%, -50%);
  display: flex; gap: 6px;
  background: var(--card);
  padding: 10px; border-radius: 12px;
  box-shadow: 0 10px 40px rgba(0,0,0,.7);
}
#promo-picker button {
  width: 64px; height: 64px; border: none; border-radius: 8px;
  background: var(--card2); cursor: pointer; transition: background .1s;
}
#promo-picker button:hover { background: var(--accent); }
#promo-picker button svg { width: 100%; height: 100%; }

#game-result {
  position: absolute; z-index: 25;
  left: 50%; top: 50%; transform: translate(-50%, -50%);
  background: rgba(28,26,24,.96);
  border: 1px solid var(--card2);
  padding: 22px 30px; border-radius: 14px;
  text-align: center;
  box-shadow: 0 10px 50px rgba(0,0,0,.8);
}
#game-result-text { font-size: 18px; font-weight: 700; margin-bottom: 14px; }

/* ---------------------------------------------------------- player bars */
.player-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 4px 6px;
  min-height: 34px;
}
.pb-name { font-weight: 700; }
.pb-captured { margin-left: 10px; font-size: 15px; color: var(--text-dim); letter-spacing: 1px; }
.pb-captured b { color: var(--accent); font-size: 12px; }
.pb-clock {
  font-variant-numeric: tabular-nums;
  font-size: 20px; font-weight: 700;
  background: var(--bg2);
  padding: 3px 14px; border-radius: 6px;
  color: var(--text-dim);
}
.pb-clock.running { color: #fff; background: #3d5228; }
.pb-clock.low.running { color: #fff; background: #6e2320; }

/* ---------------------------------------------------------- sidebar */
#sidebar {
  width: 380px;
  flex-shrink: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.panel { display: flex; flex-direction: column; gap: 12px; }
.panel.hidden { display: none; }
.hidden { display: none !important; }

.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 14px;
  display: flex; flex-direction: column; gap: 10px;
}
.card h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); }

button {
  font-family: inherit; font-size: 14px; font-weight: 600;
  background: var(--card2); color: var(--text);
  border: none; border-radius: 8px;
  padding: 9px 14px; cursor: pointer;
  transition: background .12s, transform .05s;
}
button:hover { background: #46423e; }
button:active { transform: translateY(1px); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--accent); color: #1c2513; font-weight: 700; }
button.primary:hover { background: var(--accent-hover); }
button.secondary { background: #4a6fa1; color: #fff; }
button.secondary:hover { background: #5a80b3; }

select, input[type="text"], textarea {
  font-family: inherit; font-size: 14px;
  background: var(--bg2); color: var(--text);
  border: 1px solid var(--card2); border-radius: 8px;
  padding: 8px 10px;
}
textarea { resize: vertical; width: 100%; }
input[type="text"] { width: 100%; }

.form-row { display: flex; flex-direction: column; gap: 6px; }
.form-row > label { font-size: 13px; color: var(--text-dim); font-weight: 600; }
.checkbox-row label { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text); cursor: pointer; }

.seg { display: flex; background: var(--bg2); border-radius: 8px; padding: 3px; gap: 3px; }
.seg button { flex: 1; background: none; padding: 7px 8px; }
.seg button.active { background: var(--card2); }

input[type="range"] { width: 100%; accent-color: var(--accent); }
.level-desc { font-size: 12px; color: var(--text-dim); }

.btn-row { display: flex; gap: 8px; }
.btn-row button { flex: 1; }
.nav-row button { font-size: 15px; padding: 7px; }

.engine-status { min-height: 18px; font-size: 13px; color: var(--warn); font-style: italic; }

/* ---------------------------------------------------------- move list */
.movelist-wrap {
  background: var(--bg2);
  border-radius: 8px;
  max-height: 200px;
  overflow-y: auto;
  padding: 6px 4px;
}
.movelist-wrap.tall { max-height: 260px; }
.movelist { list-style: none; }
.movelist li {
  display: flex; align-items: center; gap: 4px;
  padding: 1px 6px;
}
.movelist li:nth-child(odd) { background: rgba(255,255,255,.025); }
.mno { color: var(--text-dim); font-size: 13px; width: 30px; flex-shrink: 0; }
.mv {
  padding: 3px 8px; border-radius: 5px; cursor: pointer;
  font-weight: 600; min-width: 70px;
  display: inline-flex; align-items: center; gap: 5px;
}
.mv:hover { background: var(--card2); }
.mv.current { background: var(--accent); color: #1c2513; }
.mv.ellips { cursor: default; color: var(--text-dim); }
.mbadge {
  font-style: normal; font-size: 10px; font-weight: 800; color: #fff;
  border-radius: 8px; padding: 1px 5px; line-height: 1.3;
}

#variation-box { background: var(--bg2); border-radius: 8px; padding: 8px; }
.variation-title { font-size: 12px; color: var(--warn); font-weight: 700; margin-bottom: 5px;
  display: flex; justify-content: space-between; align-items: center; }
.variation-title button { font-size: 11px; padding: 3px 8px; }
#variation-moves { display: flex; flex-wrap: wrap; gap: 2px; }
#variation-moves .mv { min-width: 0; font-size: 13px; }

/* ---------------------------------------------------------- analysis */
.analysis-head { display: flex; align-items: center; gap: 12px; }
.analysis-score { flex: 1; display: flex; align-items: baseline; gap: 10px; }
.analysis-score b { font-size: 22px; }
.analysis-score span { font-size: 12px; color: var(--text-dim); }

.switch { position: relative; width: 44px; height: 24px; flex-shrink: 0; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch .slider {
  position: absolute; inset: 0; background: var(--bg2);
  border-radius: 24px; cursor: pointer; transition: .2s;
}
.switch .slider::before {
  content: ''; position: absolute; width: 18px; height: 18px;
  left: 3px; top: 3px; background: var(--text-dim); border-radius: 50%; transition: .2s;
}
.switch input:checked + .slider { background: var(--accent); }
.switch input:checked + .slider::before { transform: translateX(20px); background: #fff; }

#engine-lines { display: flex; flex-direction: column; gap: 4px; min-height: 66px; }
.eline {
  display: flex; gap: 10px; align-items: center;
  background: var(--bg2); border-radius: 6px; padding: 5px 8px;
  cursor: pointer; font-size: 13px;
  overflow: hidden; white-space: nowrap;
}
.eline:hover { background: var(--card2); }
.escore {
  font-weight: 800; font-variant-numeric: tabular-nums;
  background: #555; color: #fff; border-radius: 5px;
  padding: 2px 7px; font-size: 12px; flex-shrink: 0; min-width: 44px; text-align: center;
}
.escore.white-good { background: #e8e6e3; color: #222; }
.escore.black-good { background: #1a1a1a; color: #eee; }
.epv { overflow: hidden; text-overflow: ellipsis; color: var(--text-dim); }
.lines-off { color: var(--text-dim); font-size: 13px; padding: 8px; }

#analysis-progress {
  position: relative; height: 22px; background: var(--bg2); border-radius: 6px; overflow: hidden;
}
#analysis-progress-fill {
  position: absolute; left: 0; top: 0; bottom: 0; width: 0;
  background: var(--accent); transition: width .2s;
}
#analysis-progress-text {
  position: relative; z-index: 1; font-size: 12px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; height: 100%;
}

#accuracy-row { display: flex; gap: 10px; }
.acc-box {
  flex: 1; background: var(--bg2); border-radius: 8px; padding: 8px;
  display: flex; flex-direction: column; align-items: center;
}
.acc-box span { font-size: 12px; color: var(--text-dim); }
.acc-box b { font-size: 20px; }
#class-table { width: 100%; border-collapse: collapse; font-size: 13px; }
#class-table td { padding: 3px 6px; }
#class-table td:last-child { text-align: right; font-weight: 700; }
#class-table tr:nth-child(odd) { background: rgba(255,255,255,.03); }

#eval-graph {
  width: 100%; height: 90px; border-radius: 8px; cursor: crosshair;
  background: var(--bg2);
}

/* ---------------------------------------------------------- editor */
.palette { display: flex; gap: 4px; }
.palette-tools { display: flex; gap: 4px; }
.palette-piece {
  width: 52px; height: 52px; padding: 4px;
  background: var(--bg2); border-radius: 8px;
  font-size: 20px;
}
.palette-piece svg { width: 100%; height: 100%; }
.palette-piece.active { background: var(--accent); }
.castle-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.castle-grid label { display: flex; gap: 6px; align-items: center; font-size: 13px; cursor: pointer; }
.warning { color: var(--danger); font-size: 13px; font-weight: 600; }

/* ---------------------------------------------------------- scrollbars */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--card2); border-radius: 4px; }

/* ---------------------------------------------------------- responsive */
@media (max-width: 1020px) {
  body { overflow: auto; }
  #layout { flex-direction: column; align-items: center; overflow: visible; }
  #board-wrap, #evalbar { width: min(92vw, 70vh); height: min(92vw, 70vh); }
  #evalbar { width: 22px; }
  #sidebar { width: min(92vw, 560px); }
}

</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♞</text></svg>">
</head>
<body>

<header id="topbar">
  <div class="logo">♞ VEGA<span>bot</span></div>
  <nav id="tabs">
    <button class="tab active" data-mode="play">Oyna</button>
    <button class="tab" data-mode="analysis">Analiz</button>
    <button class="tab" data-mode="editor">Düzenleyici</button>
  </nav>
  <div class="top-actions">
    <select id="theme-select" title="Tahta teması">
      <option value="green">Yeşil</option>
      <option value="brown">Kahve</option>
      <option value="blue">Mavi</option>
      <option value="purple">Mor</option>
    </select>
    <button id="btn-flip" class="icon-btn" title="Tahtayı çevir (F)">⇅</button>
    <button id="btn-sound" class="icon-btn" title="Ses aç/kapat">🔊</button>
  </div>
</header>

<main id="layout">
  <div id="board-zone">
    <div id="evalbar" class="hidden">
      <div id="evalbar-white"></div>
      <span id="evalbar-num">0.0</span>
    </div>

    <div id="board-stack">
      <div class="player-bar" id="pbar-top">
        <div class="pb-left"><span class="pb-name" id="pname-top">Rakip</span>
          <span class="pb-captured" id="pcapt-top"></span></div>
        <div class="pb-clock" id="pclock-top">--:--</div>
      </div>

      <div id="board-wrap">
        <div id="board"></div>
        <svg id="overlay" viewBox="0 0 800 800" preserveAspectRatio="none"></svg>
        <div id="class-badge" class="hidden"></div>
        <div id="promo-picker" class="hidden"></div>
        <div id="game-result" class="hidden">
          <div id="game-result-text"></div>
          <button id="btn-rematch">Yeni Oyun</button>
        </div>
      </div>

      <div class="player-bar" id="pbar-bottom">
        <div class="pb-left"><span class="pb-name" id="pname-bottom">Sen</span>
          <span class="pb-captured" id="pcapt-bottom"></span></div>
        <div class="pb-clock" id="pclock-bottom">--:--</div>
      </div>
    </div>
  </div>

  <aside id="sidebar">

    <!-- ======================= OYNA ======================= -->
    <section id="panel-play" class="panel">
      <div class="card" id="newgame-card">
        <h3>Yeni Oyun</h3>
        <div class="form-row">
          <label>Renk</label>
          <div class="seg" id="color-seg">
            <button data-v="w" class="active">Beyaz</button>
            <button data-v="random">🎲</button>
            <button data-v="b">Siyah</button>
          </div>
        </div>
        <div class="form-row">
          <label>Seviye <b id="level-label">5</b></label>
          <input type="range" id="level-range" min="1" max="10" value="5">
          <div class="level-desc" id="level-desc">Kulüp oyuncusu</div>
        </div>
        <div class="form-row">
          <label>Süre</label>
          <select id="time-select">
            <option value="0">Süresiz</option>
            <option value="60,0">1 dk</option>
            <option value="180,2">3 | 2</option>
            <option value="300,0" selected>5 dk</option>
            <option value="600,0">10 dk</option>
            <option value="900,10">15 | 10</option>
          </select>
        </div>
        <div class="form-row checkbox-row">
          <label><input type="checkbox" id="book-check" checked> Açılış kitabı kullan</label>
        </div>
        <button class="primary" id="btn-start">Oyunu Başlat</button>
      </div>

      <div class="card hidden" id="game-card">
        <div class="btn-row">
          <button id="btn-hint" title="İpucu">💡 İpucu</button>
          <button id="btn-undo" title="Geri al">↩ Geri Al</button>
          <button id="btn-resign" title="Terk et">🏳 Terk</button>
          <button id="btn-newgame" title="Yeni oyun">🆕 Yeni</button>
        </div>
        <div id="engine-status" class="engine-status"></div>
        <div class="movelist-wrap"><ol id="movelist-play" class="movelist"></ol></div>
        <div class="btn-row nav-row">
          <button data-nav="start">⏮</button><button data-nav="prev">◀</button>
          <button data-nav="next">▶</button><button data-nav="end">⏭</button>
        </div>
        <button id="btn-analyze-game" class="secondary">Bu oyunu analiz et →</button>
      </div>
    </section>

    <!-- ======================= ANALİZ ======================= -->
    <section id="panel-analysis" class="panel hidden">
      <div class="card">
        <div class="analysis-head">
          <label class="switch">
            <input type="checkbox" id="engine-toggle" checked>
            <span class="slider"></span>
          </label>
          <div class="analysis-score">
            <b id="ana-score">0.0</b>
            <span id="ana-depth">derinlik 0</span>
          </div>
          <select id="multipv-select" title="Hat sayısı">
            <option value="1">1 hat</option>
            <option value="2">2 hat</option>
            <option value="3" selected>3 hat</option>
          </select>
        </div>
        <div id="engine-lines"></div>
      </div>

      <div class="card">
        <div class="movelist-wrap tall"><ol id="movelist-ana" class="movelist"></ol></div>
        <div id="variation-box" class="hidden">
          <div class="variation-title">Varyant <button id="btn-back-main">ana hatta dön ✕</button></div>
          <div id="variation-moves"></div>
        </div>
        <div class="btn-row nav-row">
          <button data-nav="start">⏮</button><button data-nav="prev">◀</button>
          <button data-nav="next">▶</button><button data-nav="end">⏭</button>
        </div>
      </div>

      <div class="card">
        <div class="btn-row">
          <button class="primary" id="btn-full-analysis">⚡ Oyun Raporu</button>
          <select id="ana-speed">
            <option value="400">Hızlı</option>
            <option value="800" selected>Normal</option>
            <option value="1600">Derin</option>
          </select>
        </div>
        <div id="analysis-progress" class="hidden"><div id="analysis-progress-fill"></div><span id="analysis-progress-text"></span></div>
        <div id="report" class="hidden">
          <div id="accuracy-row">
            <div class="acc-box"><span>Beyaz</span><b id="acc-white">--</b></div>
            <div class="acc-box"><span>Siyah</span><b id="acc-black">--</b></div>
          </div>
          <table id="class-table"></table>
        </div>
        <canvas id="eval-graph" height="90"></canvas>
      </div>

      <div class="card">
        <h3>İçe / Dışa Aktar</h3>
        <textarea id="pgn-box" placeholder="PGN veya FEN yapıştırın..." rows="3"></textarea>
        <div class="btn-row">
          <button id="btn-import">Yükle</button>
          <button id="btn-export-pgn">PGN Kopyala</button>
          <button id="btn-export-fen">FEN Kopyala</button>
        </div>
      </div>
    </section>

    <!-- ======================= DÜZENLEYİCİ ======================= -->
    <section id="panel-editor" class="panel hidden">
      <div class="card">
        <h3>Taş Paleti</h3>
        <div id="palette-white" class="palette"></div>

<script>
/*
 * SigmaBoy chess rules library (0x88 board representation)
 * Works in browser (window.SC), Web Worker (self.SC) and Node (module.exports).
 */
(function (global) {
'use strict';

// ---------------------------------------------------------------- constants
const EMPTY = 0, PAWN = 1, KNIGHT = 2, BISHOP = 3, ROOK = 4, QUEEN = 5, KING = 6;
const WHITE = 1, BLACK = -1;

const CR_WK = 1, CR_WQ = 2, CR_BK = 4, CR_BQ = 8;

// move flag bits (above bit 22)
const F_EP = 1 << 23, F_CASTLE = 1 << 24, F_DOUBLE = 1 << 25;

const KNIGHT_D = [-33, -31, -18, -14, 14, 18, 31, 33];
const BISHOP_D = [-17, -15, 15, 17];
const ROOK_D   = [-16, -1, 1, 16];
const KING_D   = [-17, -16, -15, -1, 1, 15, 16, 17];

const START_FEN = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';

const PIECE_LETTER = ['', 'p', 'n', 'b', 'r', 'q', 'k'];

// castling-rights update masks, indexed by square
const CAST_MASK = new Uint8Array(128).fill(15);
CAST_MASK[116] = 15 & ~(CR_WK | CR_WQ); // e1
CAST_MASK[112] = 15 & ~CR_WQ;           // a1
CAST_MASK[119] = 15 & ~CR_WK;           // h1
CAST_MASK[4]   = 15 & ~(CR_BK | CR_BQ); // e8
CAST_MASK[0]   = 15 & ~CR_BQ;           // a8
CAST_MASK[7]   = 15 & ~CR_BK;           // h8

// ---------------------------------------------------------------- zobrist
// deterministic xorshift PRNG so hashes are stable across sessions
function makeRng(seed) {
  let s = seed >>> 0;
  return function () {
    s ^= s << 13; s >>>= 0;
    s ^= s >>> 17;
    s ^= s << 5; s >>>= 0;
    return s;
  };
}
const rngLo = makeRng(0x9e3779b9), rngHi = makeRng(0x7f4a7c15);
const Z_PIECE_LO = [], Z_PIECE_HI = [];
for (let p = 0; p < 12; p++) {
  Z_PIECE_LO.push(new Int32Array(128));
  Z_PIECE_HI.push(new Int32Array(128));
  for (let s = 0; s < 128; s++) { Z_PIECE_LO[p][s] = rngLo() | 0; Z_PIECE_HI[p][s] = rngHi() | 0; }
}
const Z_SIDE_LO = rngLo() | 0, Z_SIDE_HI = rngHi() | 0;
const Z_CAST_LO = new Int32Array(16), Z_CAST_HI = new Int32Array(16);
for (let i = 0; i < 16; i++) { Z_CAST_LO[i] = rngLo() | 0; Z_CAST_HI[i] = rngHi() | 0; }
const Z_EP_LO = new Int32Array(8), Z_EP_HI = new Int32Array(8);
for (let i = 0; i < 8; i++) { Z_EP_LO[i] = rngLo() | 0; Z_EP_HI[i] = rngHi() | 0; }

function zPieceIndex(signedPiece) {
  // white piece types map to 0..5, black to 6..11
  return signedPiece > 0 ? signedPiece - 1 : 5 - signedPiece; // -1 -> 6, -6 -> 11
}

// ---------------------------------------------------------------- helpers
function sqToAlg(sq) {
  return String.fromCharCode(97 + (sq & 15)) + (8 - (sq >> 4));
}
function algToSq(str) {
  return (8 - (str.charCodeAt(1) - 48)) * 16 + (str.charCodeAt(0) - 97);
}
function encodeMove(from, to, piece, capt, promo, flags) {
  return from | (to << 7) | (piece << 14) | (capt << 17) | (promo << 20) | flags;
}
const mFrom  = m => m & 127;
const mTo    = m => (m >> 7) & 127;
const mPiece = m => (m >> 14) & 7;
const mCapt  = m => (m >> 17) & 7;
const mPromo = m => (m >> 20) & 7;
const mIsEp     = m => (m & F_EP) !== 0;
const mIsCastle = m => (m & F_CASTLE) !== 0;
const mIsCapture = m => ((m >> 17) & 7) !== 0 || (m & F_EP) !== 0;

// ---------------------------------------------------------------- Position
class Position {
  constructor(fen) {
    this.board = new Int8Array(128);
    this.load(fen || START_FEN);
  }

  load(fen) {
    const parts = fen.trim().split(/\s+/);
    this.board.fill(0);
    this.kings = [-1, -1]; // [white, black]
    let sq = 0;
    for (const ch of parts[0]) {
      if (ch === '/') { sq = (sq & ~15) + 16; continue; }
      if (ch >= '1' && ch <= '8') { sq += ch.charCodeAt(0) - 48; continue; }
      const lower = ch.toLowerCase();
      const type = PIECE_LETTER.indexOf(lower);
      const color = ch === lower ? BLACK : WHITE;
      this.board[sq] = type * color;
      if (type === KING) this.kings[color === WHITE ? 0 : 1] = sq;
      sq++;
    }
    this.side = (parts[1] || 'w') === 'w' ? WHITE : BLACK;
    this.castling = 0;
    const cr = parts[2] || '-';
    if (cr.indexOf('K') >= 0) this.castling |= CR_WK;
    if (cr.indexOf('Q') >= 0) this.castling |= CR_WQ;
    if (cr.indexOf('k') >= 0) this.castling |= CR_BK;
    if (cr.indexOf('q') >= 0) this.castling |= CR_BQ;
    this.ep = (parts[3] && parts[3] !== '-') ? algToSq(parts[3]) : -1;
    this.halfmove = parseInt(parts[4] || '0', 10) || 0;
    this.fullmove = parseInt(parts[5] || '1', 10) || 1;
    // preallocated undo stacks
    if (!this.stMove) {
      const N = 2048;
      this.stCast = new Int32Array(N); this.stEp = new Int32Array(N);
      this.stHalf = new Int32Array(N); this.stLo = new Int32Array(N);
      this.stHi = new Int32Array(N); this.stMove = new Int32Array(N);
    }
    this.sp = 0;
    this.computeHash();
    return this;
  }

  growStacks() {
    const N = this.stMove.length * 2;
    for (const k of ['stCast', 'stEp', 'stHalf', 'stLo', 'stHi', 'stMove']) {
      const a = new Int32Array(N);
      a.set(this[k]);
      this[k] = a;
    }
  }

  lastMove() { return this.sp > 0 ? this.stMove[this.sp - 1] : 0; }

  computeHash() {
    let lo = 0, hi = 0;
    for (let sq = 0; sq < 120; sq++) {
      if (sq & 0x88) { sq += 7; continue; }
      const p = this.board[sq];
      if (p) { const zi = zPieceIndex(p); lo ^= Z_PIECE_LO[zi][sq]; hi ^= Z_PIECE_HI[zi][sq]; }
    }
    if (this.side === BLACK) { lo ^= Z_SIDE_LO; hi ^= Z_SIDE_HI; }
    lo ^= Z_CAST_LO[this.castling]; hi ^= Z_CAST_HI[this.castling];
    if (this.ep >= 0) { lo ^= Z_EP_LO[this.ep & 7]; hi ^= Z_EP_HI[this.ep & 7]; }
    this.hashLo = lo | 0; this.hashHi = hi | 0;
  }

  fen() {
    let out = '';
    for (let r = 0; r < 8; r++) {
      let empty = 0;
      for (let f = 0; f < 8; f++) {
        const p = this.board[r * 16 + f];
        if (!p) { empty++; continue; }
        if (empty) { out += empty; empty = 0; }
        const letter = PIECE_LETTER[Math.abs(p)];
        out += p > 0 ? letter.toUpperCase() : letter;
      }
      if (empty) out += empty;
      if (r < 7) out += '/';
    }
    out += this.side === WHITE ? ' w ' : ' b ';
    let cr = '';
    if (this.castling & CR_WK) cr += 'K';
    if (this.castling & CR_WQ) cr += 'Q';
    if (this.castling & CR_BK) cr += 'k';
    if (this.castling & CR_BQ) cr += 'q';
    out += (cr || '-') + ' ';
    out += this.ep >= 0 ? sqToAlg(this.ep) : '-';
    out += ' ' + this.halfmove + ' ' + this.fullmove;
    return out;
  }

  // first four FEN fields — used as repetition / book key
  fenKey() {
    const f = this.fen().split(' ');
    return f[0] + ' ' + f[1] + ' ' + f[2] + ' ' + f[3];
  }

  clone() { return new Position(this.fen()); }

  // is `sq` attacked by side `by`?
  isAttacked(sq, by) {
    const b = this.board;
    if (by === WHITE) {
      if (b[sq + 15] === PAWN || b[sq + 17] === PAWN) return true;
    } else {
      if (b[sq - 15] === -PAWN || b[sq - 17] === -PAWN) return true;
    }
    const n = KNIGHT * by, k = KING * by;
    for (let i = 0; i < 8; i++) {
      const t = sq + KNIGHT_D[i];
      if (!(t & 0x88) && b[t] === n) return true;
    }
    for (let i = 0; i < 8; i++) {
      const t = sq + KING_D[i];
      if (!(t & 0x88) && b[t] === k) return true;
    }
    const bp = BISHOP * by, qp = QUEEN * by, rp = ROOK * by;
    for (let i = 0; i < 4; i++) {
      const d = BISHOP_D[i];
      for (let t = sq + d; !(t & 0x88); t += d) {
        const p = b[t];
        if (p) { if (p === bp || p === qp) return true; break; }
      }
    }
    for (let i = 0; i < 4; i++) {
      const d = ROOK_D[i];
      for (let t = sq + d; !(t & 0x88); t += d) {
        const p = b[t];
        if (p) { if (p === rp || p === qp) return true; break; }
      }
    }
    return false;
  }

  inCheck(side) {
    side = side || this.side;
    return this.isAttacked(this.kings[side === WHITE ? 0 : 1], -side);
  }

  // after make(): did the side that just moved leave its king attacked?
  illegalAfterMove() {
    const mover = -this.side;
    return this.isAttacked(this.kings[mover === WHITE ? 0 : 1], this.side);
  }

  // pseudo-legal move generation. capsOnly => captures + promotions (quiescence)
  genMoves(capsOnly) {
    const moves = [];
    const b = this.board, us = this.side, them = -us;
    const dir = us === WHITE ? -16 : 16;
    const startRank = us === WHITE ? 6 : 1;
    const promoRank = us === WHITE ? 0 : 7;

    for (let sq = 0; sq < 120; sq++) {
      if (sq & 0x88) { sq += 7; continue; }
      const p = b[sq];
      if (p === 0 || (p > 0) !== (us > 0)) continue;
      const type = p * us; // abs

      if (type === PAWN) {
        const fwd = sq + dir;
        if (!b[fwd]) {
          if ((fwd >> 4) === promoRank) {
            moves.push(encodeMove(sq, fwd, PAWN, 0, QUEEN, 0));
            if (!capsOnly) {
              moves.push(encodeMove(sq, fwd, PAWN, 0, ROOK, 0));
              moves.push(encodeMove(sq, fwd, PAWN, 0, BISHOP, 0));
              moves.push(encodeMove(sq, fwd, PAWN, 0, KNIGHT, 0));
            }
          } else if (!capsOnly) {
            moves.push(encodeMove(sq, fwd, PAWN, 0, 0, 0));
            if ((sq >> 4) === startRank && !b[fwd + dir])
              moves.push(encodeMove(sq, fwd + dir, PAWN, 0, 0, F_DOUBLE));
          }
        }
        for (let side2 = -1; side2 <= 1; side2 += 2) {
          const to = sq + dir + side2;
          if (to & 0x88) continue;
          const tp = b[to];
          if (tp && (tp > 0) === (them > 0)) {
            const capt = tp * them;
            if ((to >> 4) === promoRank) {
              moves.push(encodeMove(sq, to, PAWN, capt, QUEEN, 0));
              moves.push(encodeMove(sq, to, PAWN, capt, ROOK, 0));
              moves.push(encodeMove(sq, to, PAWN, capt, BISHOP, 0));
              moves.push(encodeMove(sq, to, PAWN, capt, KNIGHT, 0));
            } else {
              moves.push(encodeMove(sq, to, PAWN, capt, 0, 0));
            }
          } else if (to === this.ep && this.ep >= 0) {
            moves.push(encodeMove(sq, to, PAWN, PAWN, 0, F_EP));
          }
        }
        continue;
      }

      if (type === KNIGHT || type === KING) {
        const deltas = type === KNIGHT ? KNIGHT_D : KING_D;
        for (let i = 0; i < 8; i++) {
          const to = sq + deltas[i];
          if (to & 0x88) continue;
          const tp = b[to];
          if (tp === 0) { if (!capsOnly) moves.push(encodeMove(sq, to, type, 0, 0, 0)); }
          else if ((tp > 0) === (them > 0)) moves.push(encodeMove(sq, to, type, tp * them, 0, 0));
        }
        continue;
      }

      // sliders
      const dirs = type === BISHOP ? BISHOP_D : type === ROOK ? ROOK_D : KING_D;
      const nd = type === QUEEN ? 8 : 4;
      for (let i = 0; i < nd; i++) {
        const d = dirs[i];
        for (let to = sq + d; !(to & 0x88); to += d) {
          const tp = b[to];
          if (tp === 0) { if (!capsOnly) moves.push(encodeMove(sq, to, type, 0, 0, 0)); continue; }
          if ((tp > 0) === (them > 0)) moves.push(encodeMove(sq, to, type, tp * them, 0, 0));

        }

          moves.push(encodeMove(116, 118, KING, 0, 0, F_CASTLE));
        if ((this.castling & CR_WQ) && !b[115] && !b[114] && !b[113] &&
            !this.isAttacked(116, BLACK) && !this.isAttacked(115, BLACK) && !this.isAttacked(114, BLACK))
          moves.push(encodeMove(116, 114, KING, 0, 0, F_CASTLE));
      } else {
        if ((this.castling & CR_BK) && !b[5] && !b[6] &&
            !this.isAttacked(4, WHITE) && !this.isAttacked(5, WHITE) && !this.isAttacked(6, WHITE))
          moves.push(encodeMove(4, 6, KING, 0, 0, F_CASTLE));
        if ((this.castling & CR_BQ) && !b[3] && !b[2] && !b[1] &&
            !this.isAttacked(4, WHITE) && !this.isAttacked(3, WHITE) && !this.isAttacked(2, WHITE))
          moves.push(encodeMove(4, 2, KING, 0, 0, F_CASTLE));
      }
    }
    return moves;
  }

  legalMoves() {
    const out = [];
    const pseudo = this.genMoves(false);
    for (let i = 0; i < pseudo.length; i++) {
      this.make(pseudo[i]);
      if (!this.illegalAfterMove()) out.push(pseudo[i]);
      this.unmake();
    }
    return out;
  }

  make(m) {
    const us = this.side, them = -us;
    const from = m & 127, to = (m >> 7) & 127;
    const piece = (m >> 14) & 7, capt = (m >> 17) & 7, promo = (m >> 20) & 7;
    const b = this.board;

    let sp = this.sp;
    if (sp >= this.stMove.length) this.growStacks();
    this.stCast[sp] = this.castling; this.stEp[sp] = this.ep; this.stHalf[sp] = this.halfmove;
    this.stLo[sp] = this.hashLo; this.stHi[sp] = this.hashHi; this.stMove[sp] = m;
    this.sp = sp + 1;

    let lo = this.hashLo, hi = this.hashHi;
    if (this.ep >= 0) { lo ^= Z_EP_LO[this.ep & 7]; hi ^= Z_EP_HI[this.ep & 7]; }

    // remove moving piece from origin
    let zi = zPieceIndex(piece * us);
    b[from] = 0; lo ^= Z_PIECE_LO[zi][from]; hi ^= Z_PIECE_HI[zi][from];

    // remove captured piece
    if (m & F_EP) {
      const capSq = to + (us === WHITE ? 16 : -16);
      b[capSq] = 0;
      const czi = zPieceIndex(PAWN * them);
      lo ^= Z_PIECE_LO[czi][capSq]; hi ^= Z_PIECE_HI[czi][capSq];
    } else if (capt) {
      const czi = zPieceIndex(capt * them);
      lo ^= Z_PIECE_LO[czi][to]; hi ^= Z_PIECE_HI[czi][to];
    }

    // place piece (or promotion) at destination
    const placed = (promo || piece) * us;
    b[to] = placed;
    zi = zPieceIndex(placed);
    lo ^= Z_PIECE_LO[zi][to]; hi ^= Z_PIECE_HI[zi][to];

    if (piece === KING) {
      this.kings[us === WHITE ? 0 : 1] = to;
      if (m & F_CASTLE) {
        let rFrom, rTo;
        if ((to & 7) === 6) { rFrom = to + 1; rTo = to - 1; } // king side
        else { rFrom = to - 2; rTo = to + 1; }                 // queen side
        const rzi = zPieceIndex(ROOK * us);
        b[rTo] = ROOK * us; b[rFrom] = 0;
        lo ^= Z_PIECE_LO[rzi][rFrom] ^ Z_PIECE_LO[rzi][rTo];
        hi ^= Z_PIECE_HI[rzi][rFrom] ^ Z_PIECE_HI[rzi][rTo];
      }
    }

    // castling rights
    lo ^= Z_CAST_LO[this.castling]; hi ^= Z_CAST_HI[this.castling];
    this.castling &= CAST_MASK[from] & CAST_MASK[to];
    lo ^= Z_CAST_LO[this.castling]; hi ^= Z_CAST_HI[this.castling];

    // en passant square
    if (m & F_DOUBLE) {
      this.ep = (from + to) >> 1;
      lo ^= Z_EP_LO[this.ep & 7]; hi ^= Z_EP_HI[this.ep & 7];
    } else {
      this.ep = -1;
    }

    this.halfmove = (piece === PAWN || capt) ? 0 : this.halfmove + 1;
    if (us === BLACK) this.fullmove++;
    this.side = them;
    lo ^= Z_SIDE_LO; hi ^= Z_SIDE_HI;
    this.hashLo = lo | 0; this.hashHi = hi | 0;
  }

  unmake() {
    const sp = --this.sp;
    const m = this.stMove[sp];
    const them = this.side, us = -them;
    const from = m & 127, to = (m >> 7) & 127;
    const piece = (m >> 14) & 7, capt = (m >> 17) & 7;
    const b = this.board;

    b[from] = piece * us;
    if (m & F_EP) {
      b[to] = 0;
      b[to + (us === WHITE ? 16 : -16)] = PAWN * them;
    } else {
      b[to] = capt ? capt * them : 0;
    }

    if (piece === KING) {
      this.kings[us === WHITE ? 0 : 1] = from;
      if (m & F_CASTLE) {
        if ((to & 7) === 6) { b[to + 1] = ROOK * us; b[to - 1] = 0; }
        else { b[to - 2] = ROOK * us; b[to + 1] = 0; }
      }
    }

    this.castling = this.stCast[sp];
    this.ep = this.stEp[sp];
    this.halfmove = this.stHalf[sp];
    this.hashLo = this.stLo[sp];
    this.hashHi = this.stHi[sp];
    if (us === BLACK) this.fullmove--;
    this.side = us;
  }

  makeNull() {
    let sp = this.sp;
    if (sp >= this.stMove.length) this.growStacks();
    this.stCast[sp] = this.castling; this.stEp[sp] = this.ep; this.stHalf[sp] = this.halfmove;
    this.stLo[sp] = this.hashLo; this.stHi[sp] = this.hashHi; this.stMove[sp] = 0;
    this.sp = sp + 1;
    let lo = this.hashLo, hi = this.hashHi;
    if (this.ep >= 0) { lo ^= Z_EP_LO[this.ep & 7]; hi ^= Z_EP_HI[this.ep & 7]; }
    this.ep = -1;
    this.side = -this.side;
    this.halfmove++;
    lo ^= Z_SIDE_LO; hi ^= Z_SIDE_HI;
    this.hashLo = lo | 0; this.hashHi = hi | 0;
  }

  unmakeNull() {
    const sp = --this.sp;
    this.castling = this.stCast[sp];
    this.ep = this.stEp[sp];
    this.halfmove = this.stHalf[sp];
    this.hashLo = this.stLo[sp];
    this.hashHi = this.stHi[sp];
    this.side = -this.side;
  }

  // number of previous occurrences of the current position (same side to move)
  repetitionCount() {
    let count = 0;
    const n = this.sp;
    const limit = Math.min(this.halfmove, n);
    for (let i = 2; i <= limit; i += 2) {
      if (this.stLo[n - i] === this.hashLo && this.stHi[n - i] === this.hashHi) count++;
    }
    return count;
  }

  hasNonPawnMaterial(side) {
    const b = this.board;
    for (let sq = 0; sq < 120; sq++) {
      if (sq & 0x88) { sq += 7; continue; }
      const p = b[sq] * side;
      if (p >= KNIGHT && p <= QUEEN) return true;
    }
    return false;
  }

  insufficientMaterial() {
    let minors = 0, bishopsColor = -1, sameColorBishops = true, other = 0;
    for (let sq = 0; sq < 120; sq++) {
      if (sq & 0x88) { sq += 7; continue; }
      const t = Math.abs(this.board[sq]);
      if (t === 0 || t === KING) continue;
      if (t === KNIGHT) minors++;
      else if (t === BISHOP) {
        minors++;
        const col = ((sq >> 4) + (sq & 7)) & 1;
        if (bishopsColor === -1) bishopsColor = col;
        else if (bishopsColor !== col) sameColorBishops = false;
      } else other++;
    }
    if (other > 0) return false;
    if (minors <= 1) return true;
    // only bishops, all on the same color complex
    let knightCount = 0;
    for (let sq = 0; sq < 120; sq++) {
      if (sq & 0x88) { sq += 7; continue; }
      if (Math.abs(this.board[sq]) === KNIGHT) knightCount++;
    }

const EV_wPawns = new Uint8Array(64), EV_bPawns = new Uint8Array(64);
const EV_zoneW = new Uint8Array(136), EV_zoneB = new Uint8Array(136);

// returns score in centipawns from the side-to-move perspective
function evaluate(pos) {
  const b = pos.board;
  let mg = 0, eg = 0, phase = 0;
  let wBishops = 0, bBishops = 0, wQueens = 0, bQueens = 0;

  // pawn pre-pass: file counts + squares (reusable buffers)
  EV_wFile.fill(0); EV_bFile.fill(0);
  let wpc = 0, bpc = 0;
  for (let sq = 0; sq < 120; sq++) {
    if (sq & 0x88) { sq += 7; continue; }
    const p = b[sq];
    if (p === PAWN) { EV_wFile[(sq & 7) + 1]++; EV_wPawns[wpc++] = sq; }
    else if (p === -PAWN) { EV_bFile[(sq & 7) + 1]++; EV_bPawns[bpc++] = sq; }
  }

  // king attack zones (own king square + neighbors)
  EV_zoneW.fill(0); EV_zoneB.fill(0);
  const wk = pos.kings[0], bk = pos.kings[1];
  EV_zoneW[wk] = 1; EV_zoneB[bk] = 1;
  for (let i = 0; i < 8; i++) {
    let t = wk + KING_D[i];
    if (!(t & 0x88)) EV_zoneW[t] = 1;
    t = bk + KING_D[i];
    if (!(t & 0x88)) EV_zoneB[t] = 1;
  }
  let unitsOnW = 0, unitsOnB = 0; // attack units against each king

  for (let sq = 0; sq < 120; sq++) {
    if (sq & 0x88) { sq += 7; continue; }
    const p = b[sq];
    if (!p) continue;
    const t = p > 0 ? p : -p;
    const white = p > 0;
    const idx = white ? ((sq >> 4) << 3) | (sq & 7) : (((sq >> 4) << 3) | (sq & 7)) ^ 56;
    const sgn = white ? 1 : -1;

    mg += sgn * (MG_VAL[t] + MG_PST[t][idx]);
    eg += sgn * (EG_VAL[t] + EG_PST[t][idx]);
    phase += PHASE_W[t];

    if (t === BISHOP) { if (white) wBishops++; else bBishops++; }
    else if (t === QUEEN) { if (white) wQueens++; else bQueens++; }

    // mobility + king-zone attacks in one scan
    if (t >= KNIGHT && t <= QUEEN) {
      let mob = 0;
      const kw = KS_WEIGHT[t];
      if (t === KNIGHT) {
        for (let i = 0; i < 8; i++) {
          const to = sq + KNIGHT_D[i];
          if (to & 0x88) continue;
          if (b[to] === 0 || (b[to] > 0) !== white) mob++;
          if (white) { if (EV_zoneB[to]) unitsOnB += kw; }
          else if (EV_zoneW[to]) unitsOnW += kw;
        }
      } else {
        const dirs = t === BISHOP ? BISHOP_D : t === ROOK ? ROOK_D : QUEEN_D;
        const nd = t === QUEEN ? 8 : 4;
        for (let i = 0; i < nd; i++) {
          const d = dirs[i];
          for (let to = sq + d; !(to & 0x88); to += d) {
            if (white) { if (EV_zoneB[to]) unitsOnB += kw; }
            else if (EV_zoneW[to]) unitsOnW += kw;
            if (b[to] === 0) { mob++; continue; }
            if ((b[to] > 0) !== white) mob++;
            break;
          }
        }
      }
      mg += sgn * MOB_MG[t] * mob;
      eg += sgn * MOB_EG[t] * mob;
    }

    // rook on (semi-)open file
    if (t === ROOK) {
      const f = (sq & 7) + 1;
      const own = white ? EV_wFile[f] : EV_bFile[f];
      const opp = white ? EV_bFile[f] : EV_wFile[f];
      if (own === 0) {
        if (opp === 0) { mg += sgn * ROOK_OPEN_MG; eg += sgn * ROOK_OPEN_EG; }
        else { mg += sgn * ROOK_SEMI_MG; eg += sgn * ROOK_SEMI_EG; }
      }
    }
  }

  if (wBishops >= 2) { mg += BISHOP_PAIR_MG; eg += BISHOP_PAIR_EG; }
  if (bBishops >= 2) { mg -= BISHOP_PAIR_MG; eg -= BISHOP_PAIR_EG; }

  // king safety: attack units → table (halved without the attacker's queen)
  if (!wQueens) unitsOnB >>= 1;
  if (!bQueens) unitsOnW >>= 1;
  mg += KS_TABLE[unitsOnB > 63 ? 63 : unitsOnB];
  mg -= KS_TABLE[unitsOnW > 63 ? 63 : unitsOnW];

  // pawn structure
  for (let i = 0; i < wpc; i++) {
    const sq = EV_wPawns[i];
    const f = (sq & 7) + 1, r = sq >> 4;
    if (EV_wFile[f] > 1) { mg += DOUBLED_MG >> 1; eg += DOUBLED_EG >> 1; }
    if (EV_wFile[f - 1] === 0 && EV_wFile[f + 1] === 0) { mg += ISOLATED_MG; eg += ISOLATED_EG; }
    if (!hasEnemyPawnAhead(b, sq, true)) {
      const adv = 7 - r;
      let pm = PASSED_MG[adv] || 0, pe = PASSED_EG[adv] || 0;
      if (b[sq - 16]) { pm = (pm * 2 / 3) | 0; pe = (pe * 2 / 3) | 0; } // blockaded
      mg += pm; eg += pe;
    }
  }
  for (let i = 0; i < bpc; i++) {
    const sq = EV_bPawns[i];
    const f = (sq & 7) + 1, r = sq >> 4;
    if (EV_bFile[f] > 1) { mg -= DOUBLED_MG >> 1; eg -= DOUBLED_EG >> 1; }
    if (EV_bFile[f - 1] === 0 && EV_bFile[f + 1] === 0) { mg -= ISOLATED_MG; eg -= ISOLATED_EG; }
    if (!hasEnemyPawnAhead(b, sq, false)) {
      const adv = r;
      let pm = PASSED_MG[adv] || 0, pe = PASSED_EG[adv] || 0;
      if (b[sq + 16]) { pm = (pm * 2 / 3) | 0; pe = (pe * 2 / 3) | 0; }
      mg -= pm; eg -= pe;
    }
  }

  // king pawn shield (middlegame)
  mg += kingShield(b, pos.kings[0], true);
  mg -= kingShield(b, pos.kings[1], false);

  if (phase > 24) phase = 24;
  let score = ((mg * phase) + (eg * (24 - phase))) / 24 | 0;
  score = pos.side === WHITE ? score : -score;
  return score + TEMPO;
}

// scan same + adjacent files ahead of the pawn for enemy pawns
function hasEnemyPawnAhead(b, sq, white) {
  const dir = white ? -16 : 16;
  const enemy = white ? -PAWN : PAWN;
  for (let t = sq + dir; !(t & 0x88); t += dir) {
    if (b[t] === enemy) return true;
    if (!((t - 1) & 0x88) && b[t - 1] === enemy) return true;
    if (!((t + 1) & 0x88) && b[t + 1] === enemy) return true;
  }
  return false;
}

function kingShield(b, ksq, white) {
  const r = ksq >> 4;
  // only meaningful when the king is on its own back two ranks
  if (white && r < 6) return 0;
  if (!white && r > 1) return 0;
  const dir = white ? -16 : 16;
  const own = white ? PAWN : -PAWN;
  let score = 0;
  for (let df = -1; df <= 1; df++) {
    const s1 = ksq + dir + df, s2 = ksq + 2 * dir + df;
    if (!(s1 & 0x88) && b[s1] === own) score += 12;
    else if (!(s2 & 0x88) && b[s2] === own) score += 6;
    else score -= 10;
  }
  return score;
}

// ================================================================ NNUE
// 768 → H (clipped ReLU) → 1, side-to-move perspective, int16 quantized.
// distilled from Stockfish 18 Lite static evaluation.
let NN = null, NN_ACC = null;
function initNNUE(raw) {
  const dec = s => {
    if (typeof Buffer !== 'undefined') {
      const b = Buffer.from(s, 'base64');
      return new Int16Array(b.buffer, b.byteOffset, b.length >> 1);
    }
    const bin = atob(s);
    const u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return new Int16Array(u.buffer);
  };
  NN = { H: raw.H, W1: dec(raw.W1), B1: dec(raw.B1), W2: dec(raw.W2), B2: raw.B2 };
  NN_ACC = new Int32Array(raw.H);
}
if (global.SigmaNNUE) { try { initNNUE(global.SigmaNNUE); } catch (e) { NN = null; } }

// feature indices for a signed piece on an 0x88 square, both perspectives
function nnFeatW(p, sq) {
  const t = (p > 0 ? p : -p) - 1;
  const sq64 = ((sq >> 4) << 3) | (sq & 7);
  return ((p > 0 ? t : t + 6) << 6) | sq64;
}
function nnFeatB(p, sq) {
  const t = (p > 0 ? p : -p) - 1;
  const sq64 = (((sq >> 4) << 3) | (sq & 7)) ^ 56;
  return ((p < 0 ? t : t + 6) << 6) | sq64;
}

// returns cp from side-to-move perspective
function nnueEval(pos) {
  const H = NN.H, W1 = NN.W1, W2 = NN.W2, acc = NN_ACC;
  const b = pos.board;
  const white = pos.side === WHITE;
  for (let h = 0; h < H; h++) acc[h] = NN.B1[h];
  for (let sq = 0; sq < 120; sq++) {
    if (sq & 0x88) { sq += 7; continue; }
    const p = b[sq];
    if (!p) continue;
    const t = (p > 0 ? p : -p) - 1;                 // 0..5
    const own = (p > 0) === white;
    let sq64 = ((sq >> 4) << 3) | (sq & 7);         // a8=0 … h1=63
    if (!white) sq64 ^= 56;                         // perspective flip
    const base = (((own ? t : t + 6) << 6) | sq64) * H;
    for (let h = 0; h < H; h++) acc[h] += W1[base + h];
  }
  let out = NN.B2 * 1024;                           // align scales (see train.js)
  for (let h = 0; h < H; h++) {
    let v = acc[h];
    if (v < 0) v = 0; else if (v > 1024) v = 1024;  // clipped ReLU (scale 1024)
    out += W2[h] * v;
  }
  return ((out * 400) / 524288) | 0;
}

// ================================================================ search
const INF = 32000, MATE = 31000, MATE_BOUND = 30000;
const TT_SIZE = 1 << 21, TT_MASK = TT_SIZE - 1;
const TT_EXACT = 1, TT_LOWER = 2, TT_UPPER = 3;
const MAX_PLY = 96;

// log-based late-move-reduction table [depth][moveNumber]
const LMR_TABLE = (() => {
  const t = [];
  for (let d = 0; d < 64; d++) {
    t.push(new Int8Array(64));
    for (let m = 0; m < 64; m++) {
      t[d][m] = (d > 0 && m > 0) ? Math.max(0, Math.round(0.5 + Math.log(d) * Math.log(m) / 2.4)) : 0;
    }
  }
  return t;
})();

// static-exchange-evaluation scratch buffers
const SEE_GAIN = new Int32Array(34);
const SEE_RS = new Int32Array(34), SEE_RP = new Int32Array(34);

class AbortSearch extends Error {}

class Engine {
  constructor() {
    this.pos = new SC.Position();
    this.ttKey   = new Int32Array(TT_SIZE);
    this.ttMove  = new Int32Array(TT_SIZE);
    this.ttScore = new Int16Array(TT_SIZE);
    this.ttDepth = new Int8Array(TT_SIZE);
    this.ttFlag  = new Uint8Array(TT_SIZE);
    this.ttAge   = new Uint8Array(TT_SIZE);
    this.age = 0;
    this.killer1 = new Int32Array(MAX_PLY);
    this.killer2 = new Int32Array(MAX_PLY);
    this.history = new Int32Array(2 * 7 * 128);
    this.counter = new Int32Array(2 * 7 * 128); // countermove heuristic
    this.evalStack = new Int32Array(MAX_PLY);
    this.pvTable = [];
    this.pvLen = new Int32Array(MAX_PLY);
    this.scoreBufs = [];
    for (let i = 0; i < MAX_PLY; i++) {
      this.pvTable.push(new Int32Array(MAX_PLY));
      this.scoreBufs.push(new Int32Array(256));
    }
    // 'nnue' | 'hce' | 'blend' — hce is the measured-strongest default;
    // nnue mode is available and used when it wins the eval playoff
    this.evalMode = 'hce';
    // incremental NNUE accumulators: one pair (white/black perspective) per ply level
    if (NN) {
      this.accW = []; this.accB = [];
      for (let i = 0; i < MAX_PLY + 8; i++) { this.accW.push(new Int32Array(NN.H)); this.accB.push(new Int32Array(NN.H)); }
    }
    this.accLevel = 0;
    this.nodes = 0;
    this.stopFlag = false;
    this.deadline = Infinity;
    this.rndState = 0x1234567 ^ (Date.now() & 0xffff);
  }

  eval_(pos) {
    if (NN && this.evalMode === 'nnue') return this.nnueFast(pos);
    if (NN && this.evalMode === 'blend') return (this.nnueFast(pos) + evaluate(pos)) >> 1;
    return evaluate(pos);
  }

  // rebuild accumulators for the root position (called once per go)
  refreshAcc() {
    if (!NN || this.evalMode === 'hce') return;
    const H = NN.H, W1 = NN.W1;
    const aw = this.accW[0], ab = this.accB[0];
    for (let h = 0; h < H; h++) { aw[h] = NN.B1[h]; ab[h] = NN.B1[h]; }
    const b = this.pos.board;
    for (let sq = 0; sq < 120; sq++) {
      if (sq & 0x88) { sq += 7; continue; }
      const p = b[sq];
      if (!p) continue;
      const bw = nnFeatW(p, sq) * H, bb = nnFeatB(p, sq) * H;
      for (let h = 0; h < H; h++) { aw[h] += W1[bw + h]; ab[h] += W1[bb + h]; }
    }
    this.accLevel = 0;
  }

  accApply(p, sq, sign) {
    const H = NN.H, W1 = NN.W1;
    const aw = this.accW[this.accLevel], ab = this.accB[this.accLevel];
    const bw = nnFeatW(p, sq) * H, bb = nnFeatB(p, sq) * H;
    if (sign > 0) for (let h = 0; h < H; h++) { aw[h] += W1[bw + h]; ab[h] += W1[bb + h]; }
    else for (let h = 0; h < H; h++) { aw[h] -= W1[bw + h]; ab[h] -= W1[bb + h]; }
  }

  // make/unmake wrappers that keep the accumulators in sync
  makeNN(m) {
    const pos = this.pos;
    const us = pos.side; // mover (before make)
    pos.make(m);
    if (!NN || this.evalMode === 'hce') return;
    const lv = this.accLevel;
    this.accW[lv + 1].set(this.accW[lv]);
    this.accB[lv + 1].set(this.accB[lv]);
    this.accLevel = lv + 1;
    const from = m & 127, to = (m >> 7) & 127;
    const piece = (m >> 14) & 7, capt = (m >> 17) & 7, promo = (m >> 20) & 7;
    this.accApply(piece * us, from, -1);
    if (m & SC.F_EP) this.accApply(-us, to + (us === WHITE ? 16 : -16), -1);
    else if (capt) this.accApply(capt * -us, to, -1);
    this.accApply((promo || piece) * us, to, 1);
    if (m & SC.F_CASTLE) {
      let rf, rt;
      if ((to & 7) === 6) { rf = to + 1; rt = to - 1; } else { rf = to - 2; rt = to + 1; }
      this.accApply(ROOK * us, rf, -1);
      this.accApply(ROOK * us, rt, 1);
    }
  }

  unmakeNN() {
    this.pos.unmake();
    if (NN && this.evalMode !== 'hce') this.accLevel--;
  }

  makeNullNN() {
    this.pos.makeNull();
    if (!NN || this.evalMode === 'hce') return;
    const lv = this.accLevel;
    this.accW[lv + 1].set(this.accW[lv]);
    this.accB[lv + 1].set(this.accB[lv]);
    this.accLevel = lv + 1;
  }

  unmakeNullNN() {
    this.pos.unmakeNull();
    if (NN && this.evalMode !== 'hce') this.accLevel--;
  }

  // output layer over the maintained accumulator (stm perspective)
  nnueFast(pos) {
    const H = NN.H, W2 = NN.W2;
    const acc = pos.side === WHITE ? this.accW[this.accLevel] : this.accB[this.accLevel];
    let out = NN.B2 * 1024;
    for (let h = 0; h < H; h++) {
      let v = acc[h];
      if (v < 0) v = 0; else if (v > 1024) v = 1024;
      out += W2[h] * v;
    }
    return ((out * 400) / 524288) | 0;
  }

  rnd() { // xorshift for level-based randomness
    let s = this.rndState;
    s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0;
    this.rndState = s;
    return s / 4294967296;
  }

  clearTables() {
    this.ttKey.fill(0); this.ttMove.fill(0); this.ttScore.fill(0);
    this.ttDepth.fill(0); this.ttFlag.fill(0); this.ttAge.fill(0);
    this.history.fill(0); this.counter.fill(0);
    this.killer1.fill(0); this.killer2.fill(0);
  }

  setPosition(fen, ucis) {
    this.pos.load(fen || SC.START_FEN);
    if (ucis) for (const u of ucis) {
      const m = this.pos.moveFromUci(u);
      if (m) this.pos.make(m);
    }
  }

  checkTime() {
    if (this.stopFlag) throw new AbortSearch();
    if ((this.nodes & 2047) === 0 && Date.now() > this.deadline) throw new AbortSearch();
  }

  histIdx(side, piece, to) { return (side === WHITE ? 0 : 7 * 128) + piece * 128 + (to & 127); }

  // countermove slot for the move that led to the current position
  cmIdx(prevMove, sideToMove) {
    return (sideToMove === WHITE ? 0 : 7 * 128) + mPiece(prevMove) * 128 + (mTo(prevMove) & 127);
  }

  // smallest attacker of `to` for `side`, honoring pieces removed during SEE
  smallestAttacker(to, side) {
    const b = this.pos.board;
    let t;
    if (side === WHITE) {
      t = to + 15; if (!(t & 0x88) && b[t] === PAWN) return t;
      t = to + 17; if (!(t & 0x88) && b[t] === PAWN) return t;
    } else {
      t = to - 15; if (!(t & 0x88) && b[t] === -PAWN) return t;
      t = to - 17; if (!(t & 0x88) && b[t] === -PAWN) return t;
    }
    const kn = KNIGHT * side;
    for (let i = 0; i < 8; i++) {
      t = to + KNIGHT_D[i];
      if (!(t & 0x88) && b[t] === kn) return t;
    }
    const bi = BISHOP * side, ro = ROOK * side, qu = QUEEN * side;
    for (let i = 0; i < 4; i++) {
      const d = BISHOP_D[i];
      for (t = to + d; !(t & 0x88); t += d) { const p = b[t]; if (p) { if (p === bi) return t; break; } }
    }
    for (let i = 0; i < 4; i++) {
      const d = ROOK_D[i];
      for (t = to + d; !(t & 0x88); t += d) { const p = b[t]; if (p) { if (p === ro) return t; break; } }
    }
    for (let i = 0; i < 8; i++) {
      const d = QUEEN_D[i];
      for (t = to + d; !(t & 0x88); t += d) { const p = b[t]; if (p) { if (p === qu) return t; break; } }
    }
    const ki = KING * side;
    for (let i = 0; i < 8; i++) {
      t = to + KING_D[i];
      if (!(t & 0x88) && b[t] === ki) return t;
    }
    return -1;
  }

  // static exchange evaluation: expected material outcome of a capture (cp)
  see(m) {
    if (m & SC.F_EP) return 0;
    const b = this.pos.board;
    const to = mTo(m), from = mFrom(m);
    let d = 0, nr = 0;
    SEE_GAIN[0] = SEE_VAL[mCapt(m)];
    let occupierVal = SEE_VAL[mPiece(m)];
    SEE_RS[nr] = from; SEE_RP[nr++] = b[from]; b[from] = 0;
    let side = -this.pos.side;
    for (;;) {
      const a = this.smallestAttacker(to, side);
      if (a < 0 || d >= 30) break;
      d++;
      SEE_GAIN[d] = occupierVal - SEE_GAIN[d - 1];
      if (Math.max(-SEE_GAIN[d - 1], SEE_GAIN[d]) < 0) break;
      occupierVal = SEE_VAL[b[a] > 0 ? b[a] : -b[a]];
      SEE_RS[nr] = a; SEE_RP[nr++] = b[a]; b[a] = 0;
      side = -side;
    }
    while (nr > 0) { nr--; b[SEE_RS[nr]] = SEE_RP[nr]; }
    while (d > 0) { SEE_GAIN[d - 1] = -Math.max(-SEE_GAIN[d - 1], SEE_GAIN[d]); d--; }
    return SEE_GAIN[0];
  }

  scoreMoves(moves, ttMove, ply) {
    const pos = this.pos;
    const scores = moves.length <= 256 ? this.scoreBufs[ply] : new Int32Array(moves.length);
    const prevM = pos.lastMove();
    const cm = prevM ? this.counter[this.cmIdx(prevM, pos.side)] : 0;
    for (let i = 0; i < moves.length; i++) {
      const m = moves[i];
      if (m === ttMove) { scores[i] = 2000000000; continue; }
      const capt = mCapt(m), promo = mPromo(m);
      if (capt) scores[i] = 1000000000 + capt * 100 - mPiece(m) + (promo === QUEEN ? 500 : 0);
      else if (promo === QUEEN) scores[i] = 999000000;
      else if (promo) scores[i] = 500000;
      else if (m === this.killer1[ply]) scores[i] = 900000000;
      else if (m === cm) scores[i] = 850000000;
      else if (m === this.killer2[ply]) scores[i] = 800000000;
      else scores[i] = this.history[this.histIdx(pos.side, mPiece(m), mTo(m))];
    }
    return scores;
  }

  pickMove(moves, scores, start) {
    let bi = start;
    for (let i = start + 1; i < moves.length; i++) if (scores[i] > scores[bi]) bi = i;
    if (bi !== start) {
      const tm = moves[bi]; moves[bi] = moves[start]; moves[start] = tm;
      const ts = scores[bi]; scores[bi] = scores[start]; scores[start] = ts;
    }
    return moves[start];
  }

  qsearch(alpha, beta, ply) {
    this.nodes++;
    this.checkTime();
    const pos = this.pos;
    if (ply >= MAX_PLY - 1) return this.eval_(pos);

    const inCheck = pos.inCheck();
    let best;
    if (inCheck) {
      best = -MATE + ply; // will be overwritten unless mated
    } else {
      best = this.eval_(pos);
      if (best >= beta) return best;
      if (best > alpha) alpha = best;
    }

    const moves = pos.genMoves(!inCheck);
    const scores = this.scoreMoves(moves, 0, ply);
    let legal = 0;
    for (let i = 0; i < moves.length; i++) {
      const m = this.pickMove(moves, scores, i);
      if (!inCheck && !mPromo(m)) {
        const capt = mCapt(m);
        // delta pruning
        if (best + SEE_VAL[capt] + 200 <= alpha) continue;
        // skip losing captures (SEE)
        if (SEE_VAL[capt] < SEE_VAL[mPiece(m)] && this.see(m) < 0) continue;
      }
      this.makeNN(m);
      if (pos.illegalAfterMove()) { this.unmakeNN(); continue; }
      legal++;
      const score = -this.qsearch(-beta, -alpha, ply + 1);
      this.unmakeNN();
      if (score > best) {
        best = score;
        if (score > alpha) {
          alpha = score;
          if (alpha >= beta) break;
        }
      }
    }
    if (inCheck && legal === 0) return -MATE + ply;
    return best;
  }

  search(depth, alpha, beta, ply, nullOk) {
    const pos = this.pos;
    this.pvLen[ply] = 0;

    if (ply > 0) {
      if (pos.halfmove >= 100 || pos.repetitionCount() >= 1) { this.nodes++; return 0; }
      // mate distance pruning
      if (alpha < -MATE + ply) alpha = -MATE + ply;
      if (beta > MATE - ply - 1) beta = MATE - ply - 1;
      if (alpha >= beta) return alpha;
    }

    const inCheck = pos.inCheck();
    if (inCheck) depth++;
    if (depth <= 0) return this.qsearch(alpha, beta, ply);

    this.nodes++;
    this.checkTime();
    if (ply >= MAX_PLY - 1) return this.eval_(pos);

    const isPv = beta - alpha > 1;

    // transposition table probe
    const idx = (pos.hashLo & TT_MASK) >>> 0;
    let ttMove = 0;
    if (this.ttKey[idx] === pos.hashHi && this.ttFlag[idx] !== 0) {
      ttMove = this.ttMove[idx];
      if (!isPv && ply > 0 && this.ttDepth[idx] >= depth) {
        let s = this.ttScore[idx];
        if (s > MATE_BOUND) s -= ply; else if (s < -MATE_BOUND) s += ply;
        const f = this.ttFlag[idx];
        if (f === TT_EXACT) return s;
        if (f === TT_LOWER && s >= beta) return s;
        if (f === TT_UPPER && s <= alpha) return s;
      }
    }

    const staticEval = inCheck ? -INF : this.eval_(pos);
    this.evalStack[ply] = staticEval;
    const improving = !inCheck && ply >= 2 && staticEval > this.evalStack[ply - 2];

    if (!isPv && !inCheck && Math.abs(beta) < MATE_BOUND) {
      // reverse futility pruning (static null move)
      if (depth <= 6 && staticEval - (improving ? 70 : 90) * depth >= beta)
        return staticEval;

      // razoring: hopeless shallow nodes drop to quiescence
      if (depth <= 2 && staticEval + 200 + 150 * depth < alpha) {
        const v = this.qsearch(alpha, beta, ply);
        if (v < alpha) return v;
      }

      // null-move pruning
      if (nullOk && depth >= 3 && staticEval >= beta && pos.hasNonPawnMaterial(pos.side)) {
        const R = 3 + (depth >> 3) + (staticEval - beta > 200 ? 1 : 0);
        this.makeNullNN();
        let score;
        try {
          score = -this.search(Math.max(0, depth - 1 - R), -beta, -beta + 1, ply + 1, false);
        } finally {
          this.unmakeNullNN();
        }
        if (score >= beta && score < MATE_BOUND) return beta;
      }
    }

    // internal iterative deepening: get a TT move for ordering in PV nodes
    if (isPv && !ttMove && depth >= 5) {
      this.search(depth - 2, alpha, beta, ply, false);
      if (this.ttKey[idx] === pos.hashHi) ttMove = this.ttMove[idx];
    }

    const futile = !isPv && !inCheck && depth <= 3 && staticEval + 100 + 120 * depth <= alpha;
    const lmpMax = improving ? 4 + depth * depth : 2 + ((depth * depth) >> 1);

    const moves = pos.genMoves(false);
    const scores = this.scoreMoves(moves, ttMove, ply);
    const prevM = pos.lastMove();

    let legal = 0, bestScore = -INF, bestMove = 0, ttStoreFlag = TT_UPPER;
    for (let i = 0; i < moves.length; i++) {
      const m = this.pickMove(moves, scores, i);
      const capt = mCapt(m), promo = mPromo(m);
      const quiet = !mIsCapture(m) && !promo;

      if (!isPv && !inCheck && bestScore > -MATE_BOUND && legal > 0) {
        // late move (move-count) pruning of quiets at shallow depth
        if (quiet && depth <= 5 && legal >= lmpMax) continue;
        // prune clearly losing captures at shallow depth (SEE)
        if (capt && !promo && depth <= 4 &&
            SEE_VAL[capt] < SEE_VAL[mPiece(m)] && this.see(m) < -80 * depth) continue;
      }

      this.makeNN(m);
      if (pos.illegalAfterMove()) { this.unmakeNN(); continue; }
      legal++;
      const givesCheck = pos.inCheck();

      if (futile && quiet && legal > 1 && !givesCheck) { this.unmakeNN(); continue; }

      let score;
      try {
        if (legal === 1) {
          score = -this.search(depth - 1, -beta, -alpha, ply + 1, true);
        } else {
          // late move reductions (log table)
          let R = 0;
          if (quiet && depth >= 3 && !inCheck && !givesCheck && legal > 2) {
            R = LMR_TABLE[depth > 63 ? 63 : depth][legal > 63 ? 63 : legal];
            if (isPv) R--;
            if (!improving) R++;
            if (m === this.killer1[ply] || m === this.killer2[ply]) R--;
            if (R < 0) R = 0;
            const maxR = depth - 2;
            if (R > maxR) R = maxR > 0 ? maxR : 0;
          }
          score = -this.search(depth - 1 - R, -alpha - 1, -alpha, ply + 1, true);
          if (score > alpha && R > 0)
            score = -this.search(depth - 1, -alpha - 1, -alpha, ply + 1, true);
          if (score > alpha && score < beta)
            score = -this.search(depth - 1, -beta, -alpha, ply + 1, true);
        }
      } finally {
        this.unmakeNN();
      }

      if (score > bestScore) {
        bestScore = score;
        bestMove = m;
        if (score > alpha) {
          alpha = score;
          ttStoreFlag = TT_EXACT;
          // update PV
          this.pvTable[ply][0] = m;
          const childLen = this.pvLen[ply + 1];
          for (let j = 0; j < childLen; j++) this.pvTable[ply][j + 1] = this.pvTable[ply + 1][j];
          this.pvLen[ply] = childLen + 1;
          if (alpha >= beta) {
            ttStoreFlag = TT_LOWER;
            if (quiet) {
              if (this.killer1[ply] !== m) { this.killer2[ply] = this.killer1[ply]; this.killer1[ply] = m; }
              if (prevM) this.counter[this.cmIdx(prevM, pos.side)] = m;
              const hi = this.histIdx(pos.side, mPiece(m), mTo(m));
              this.history[hi] += depth * depth;
              if (this.history[hi] > 400000) for (let k = 0; k < this.history.length; k++) this.history[k] >>= 1;
            }
            break;
          }
        }
      }
    }

    if (legal === 0) return inCheck ? -MATE + ply : 0;

    // store to TT (prefer deeper / fresher entries)
    if (this.ttFlag[idx] === 0 || this.ttAge[idx] !== this.age ||
        depth >= this.ttDepth[idx] || ttStoreFlag === TT_EXACT) {
      let stScore = bestScore;
      if (stScore > MATE_BOUND) stScore += ply; else if (stScore < -MATE_BOUND) stScore -= ply;
      this.ttKey[idx] = pos.hashHi;
      this.ttMove[idx] = bestMove;
      this.ttScore[idx] = stScore;
      this.ttDepth[idx] = depth;
      this.ttFlag[idx] = ttStoreFlag;
      this.ttAge[idx] = this.age;
    }

    return bestScore;
  }

  // search the root position; returns {move, score, pv, depth}
  // opts: {depth, movetime, multipv, excluded:[moveInts], onInfo}
  searchRoot(maxDepth, excluded, onInfo, multipvIdx) {
    const pos = this.pos;
    const rootMoves = pos.legalMoves().filter(m => !excluded.has(m));
    if (rootMoves.length === 0) return null;

    let best = { move: rootMoves[0], score: -INF, pv: [rootMoves[0]], depth: 0 };
    let prevScore = 0;

    for (let depth = 1; depth <= maxDepth; depth++) {
      let alpha = depth >= 5 ? prevScore - 35 : -INF;
      let beta  = depth >= 5 ? prevScore + 35 : INF;
      let iterBest = null;

      for (;;) { // aspiration loop
        iterBest = null;
        let a = alpha;
        const scores = this.scoreMoves(rootMoves, best.move, 0);
        let aborted = false;

        for (let i = 0; i < rootMoves.length; i++) {
          const m = this.pickMove(rootMoves, scores, i);
          this.makeNN(m);
          let score;
          try {
            if (i === 0) score = -this.search(depth - 1, -beta, -a, 1, true);
            else {
              score = -this.search(depth - 1, -a - 1, -a, 1, true);
              if (score > a && score < beta) score = -this.search(depth - 1, -beta, -a, 1, true);
            }
          } catch (e) {
            this.unmakeNN();
            if (e instanceof AbortSearch) { aborted = true; break; }
            throw e;
          }
          this.unmakeNN();
          if (score > a || i === 0) {
            a = Math.max(a, score);
            const pv = [m];
            for (let j = 0; j < this.pvLen[1]; j++) pv.push(this.pvTable[1][j]);
            iterBest = { move: m, score, pv, depth };
          }
          if (a >= beta) break;
        }

        if (aborted) {
          // keep result from last fully searched iteration
          return best.depth > 0 ? best : (iterBest || best);
        }
        if (iterBest && iterBest.score <= alpha && alpha > -INF) { alpha = Math.max(-INF, alpha - 150); continue; }
        if (iterBest && iterBest.score >= beta && beta < INF) { beta = Math.min(INF, beta + 150); continue; }
        break;
      }

      if (iterBest) {
        best = iterBest;
        prevScore = iterBest.score;
        if (onInfo) onInfo({
          depth, multipv: (multipvIdx || 0) + 1,
          score: iterBest.score, pv: iterBest.pv.map(m2 => this.uciOf(m2, iterBest.pv)),
          pvMoves: iterBest.pv.slice(),
          nodes: this.nodes,
        });
      }
      // stop early if a forced mate is found and confirmed a couple plies deep
      if (Math.abs(best.score) > MATE_BOUND && depth >= 6) break;
      if (Date.now() > this.softDeadline) break;
    }
    return best;
  }

  uciOf(m) {
    let s = SC.sqToAlg(mFrom(m)) + SC.sqToAlg(mTo(m));
    if (mPromo(m)) s += SC.PIECE_LETTER[mPromo(m)];
    return s;
  }

  /*
   * opts: { depth, movetime, multipv, level, useBook, onInfo }
   * returns { bestmove(uci|null), score, mate, pv, lines:[{...}] }
   */
  go(opts) {
    const o = opts || {};
    this.stopFlag = false;
    this.nodes = 0;
    const movetime = o.movetime || 0;
    const maxDepth = Math.min(o.depth || 64, MAX_PLY - 8);
    const now = Date.now();
    this.deadline = movetime ? now + movetime : Infinity;
    this.softDeadline = movetime ? now + movetime * 0.6 : Infinity;
    this.age = (this.age + 1) & 255;
    this.killer1.fill(0); this.killer2.fill(0);
    for (let k = 0; k < this.history.length; k++) this.history[k] = (this.history[k] / 8) | 0;

    // opening book
    if (o.useBook && BOOK) {
      const key = this.pos.fenKey();
      const entries = BOOK[key];
      if (entries && entries.length) {
        let total = 0;
        for (const e of entries) total += e[1];
        let r = this.rnd() * total;
        let choice = entries[0][0];
        for (const e of entries) { r -= e[1]; if (r <= 0) { choice = e[0]; break; } }
        if (this.pos.moveFromUci(choice)) {
          return { bestmove: choice, score: 0, mate: null, pv: [choice], lines: [], book: true };
        }
      }
    }

    this.refreshAcc();

    // weak levels: shallow full-width root scoring + noisy pick
    if (o.level && o.level <= 4) return this.goWeak(o);

    const multipv = Math.max(1, Math.min(o.multipv || 1, 5));
    const excluded = new Set();
    const lines = [];
    let first = null;
    for (let k = 0; k < multipv; k++) {
      if (movetime) {
        // split the remaining time budget across the remaining PV lines
        const remaining = this.deadline - Date.now();
        if (remaining <= 0 && k > 0) break;
        this.softDeadline = Date.now() + Math.max(50, remaining / (multipv - k)) * 0.6;
      }
      const res = this.searchRoot(maxDepth, excluded, o.onInfo, k);
      if (!res) break;
      lines.push(res);
      excluded.add(res.move);
      if (k === 0) first = res;
    }
    if (!first) return { bestmove: null, score: 0, mate: null, pv: [], lines: [] };

    const mate = Math.abs(first.score) > MATE_BOUND ? Math.sign(first.score) * (MATE - Math.abs(first.score) + 1 >> 1) : null;
    return {
      bestmove: this.uciOf(first.move),
      score: first.score,
      mate,
      pv: first.pv.map(m => this.uciOf(m)),
      lines: lines.map(l => ({
        move: this.uciOf(l.move), score: l.score,
        mate: Math.abs(l.score) > MATE_BOUND ? Math.sign(l.score) * (MATE - Math.abs(l.score) + 1 >> 1) : null,
        pv: l.pv.map(m => this.uciOf(m)), depth: l.depth,
      })),
      nodes: this.nodes,
    };
  }

  // shallow search with score noise → human-ish weak play
  goWeak(o) {
    const level = o.level;
    const depth = level;                     // 1..4
    const noise = [0, 320, 190, 100, 45][level] || 45;
    const pos = this.pos;
    const rootMoves = pos.legalMoves();
    if (rootMoves.length === 0) return { bestmove: null, score: 0, mate: null, pv: [], lines: [] };
    this.deadline = Date.now() + 4000;
    this.softDeadline = Infinity;

    const scored = [];
    for (const m of rootMoves) {
      this.makeNN(m);
      let s;
      try { s = -this.search(depth - 1, -INF, INF, 1, true); }
      catch (e) { if (e instanceof AbortSearch) { this.unmakeNN(); break; } this.unmakeNN(); throw e; }
      this.unmakeNN();
      scored.push({ m, s: s + (this.rnd() * 2 - 1) * noise });
    }
    scored.sort((a, b2) => b2.s - a.s);
    const pick = scored[0];
    return {
      bestmove: this.uciOf(pick.m), score: Math.round(pick.s), mate: null,
      pv: [this.uciOf(pick.m)], lines: [], nodes: this.nodes,
    };
  }

  stop() { this.stopFlag = true; }
}

let BOOK = null;
function buildBook() {
  BOOK = Object.create(null);
  const pos = new SC.Position();
  for (const line of BOOK_LINES) {
    pos.load(SC.START_FEN);
    const sans = line.split(/\s+/);
    let ok = true;
    for (const sanTok of sans) {
      if (!/^[a-hRNBQKO]/.test(sanTok) || /[?]/.test(sanTok)) { ok = false; break; }
      const key = pos.fenKey();
      const m = pos.moveFromSan(sanTok);
      if (!m) { ok = false; break; }
      const uci = pos.moveToUci(m);
      let entries = BOOK[key];
      if (!entries) entries = BOOK[key] = [];
      const found = entries.find(e => e[0] === uci);
      if (found) found[1]++; else entries.push([uci, 1]);
      pos.make(m);
    }
  }
}
buildBook();

const EngineAPI = { Engine, evaluate, nnueEval: p2 => NN ? nnueEval(p2) : null, hasNNUE: () => !!NN, AbortSearch, getBook: () => BOOK };

// ================================================================ worker glue
if (typeof importScripts === 'function' && typeof postMessage === 'function') {
  const engine = new Engine();
  let searching = false;
  let pending = null;   // last received go/position while searching
  let stopRequested = false;

  function runGo(payload) {
    searching = true;
    stopRequested = false;
    const id = payload.id;

    // async iterative wrapper: run whole go() but yield between multipv/none.
    // go() itself respects movetime; stop() aborts via time-check path.
    Promise.resolve().then(() => {
      let result;
      try {
        result = engine.go({
          depth: payload.depth,
          movetime: payload.movetime,
          multipv: payload.multipv,
          level: payload.level,
          useBook: payload.useBook,
          onInfo: info => postMessage({ type: 'info', id, ...info }),

<script>
/*
 * SigmaBoy — application UI

(function () {
'use strict';

const $ = id => document.getElementById(id);
const { Position, START_FEN, mFrom, mTo, mPromo, mCapt, mIsCastle, mIsEp } = SC;
const Sound = window.SigmaSound;
const { pieceSvg } = window.SigmaPieces;

const PIECE_CODE = { 1: 'p', 2: 'n', 3: 'b', 4: 'r', 5: 'q', 6: 'k' };
const UNI = { p: '♟', n: '♞', b: '♝', r: '♜', q: '♛', k: '♚' };
const VAL = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 0 };

function codeAt(board, sq) {
  const p = board[sq];
  if (!p) return null;
  return (p > 0 ? 'w' : 'b') + PIECE_CODE[Math.abs(p)];
}
function winPct(cpWhite, mateWhite) {
  if (mateWhite != null) return mateWhite > 0 ? 100 : 0;
  return 50 + 50 * (2 / (1 + Math.exp(-0.00368208 * cpWhite)) - 1);
}
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function fmtScore(cpWhite, mateWhite) {
  if (mateWhite != null) return (mateWhite > 0 ? '+M' : '-M') + Math.abs(mateWhite);
  const p = cpWhite / 100;
  return (p > 0 ? '+' : '') + p.toFixed(1);
}

// ================================================================ engine ctl
class EngineCtl {
  constructor() {
    this.worker = null; this.local = null; this.loadingLocal = false;
    this.busy = false; this.queued = null;
    this.seq = 0; this.currentId = 0; this.currentResolve = null;
    this.onInfo = null; this.bookKeys = new Set();
  }
  init() {
    try {
      // single-file bundle embeds the worker source; repo layout loads it by path
      if (window.SIGMA_ENGINE_SRC) {
        const blob = new Blob([window.SIGMA_ENGINE_SRC], { type: 'text/javascript' });
        this.worker = new Worker(URL.createObjectURL(blob));
      } else {
        this.worker = new Worker('js/engine.js');
      }
      this.worker.onmessage = e => this.handle(e.data);
      this.worker.onerror = () => { this.worker = null; this.fallback(); };
    } catch (e) { this.worker = null; this.fallback(); }
  }
  fallback() {
    if (this.local || this.loadingLocal) return;
    if (window.SigmaEngine) { // engine already on the page (bundle) → run on main thread
      this.local = new window.SigmaEngine.Engine();
      this.bookKeys = new Set(Object.keys(window.SigmaEngine.getBook()));
      this.pump();
      return;
    }
    this.loadingLocal = true;
    const s = document.createElement('script');
    s.src = 'js/engine.js';
    s.onload = () => {
      this.local = new window.SigmaEngine.Engine();
      this.bookKeys = new Set(Object.keys(window.SigmaEngine.getBook()));
      this.loadingLocal = false;
      this.pump();
    };
    document.head.appendChild(s);
  }
  handle(msg) {
    if (msg.type === 'boot') { if (msg.bookKeys) this.bookKeys = new Set(msg.bookKeys); return; }
    if (msg.type === 'info') {
      if (msg.id === this.currentId && this.onInfo) this.onInfo(msg);
      return;
    }
    if (msg.type === 'bestmove' && msg.id === this.currentId) {
      const r = this.currentResolve;
      this.busy = false; this.currentResolve = null;
      if (r) r(msg);
      this.pump();
    }
  }
  // latest-wins queue: a queued-but-unsent request is superseded (resolves null)
  request(params) {
    return new Promise(resolve => {
      if (this.queued) this.queued.resolve(null);
      this.queued = { params, resolve };
      this.pump();
    });
  }
  pump() {
    if (this.busy || !this.queued) return;
    if (!this.worker && !this.local) return;
    const q = this.queued;
    this.queued = null;
    this.busy = true;
    this.currentId = ++this.seq;
    this.currentResolve = q.resolve;
    if (this.worker) {
      this.worker.postMessage({ cmd: 'go', id: this.currentId, ...q.params });
    } else {
      const id = this.currentId;
      setTimeout(() => {
        this.local.setPosition(q.params.fen, q.params.moves);
        let result;
        try {
          result = this.local.go({
            ...q.params,
            movetime: Math.min(q.params.movetime || 1500, 2000),
            onInfo: info => { if (id === this.currentId && this.onInfo) this.onInfo({ id, ...info }); },
          });
        } catch (e) { result = { bestmove: null, error: String(e) }; }
        this.handle({ type: 'bestmove', id, ...result });
      }, 20);
    }
  }
  stop() { if (this.worker) this.worker.postMessage({ cmd: 'stop' }); }
}
const engine = new EngineCtl();

// ================================================================ state
const S = {
